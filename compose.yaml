name: distro

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: distro
      POSTGRES_PASSWORD: distro
      POSTGRES_DB: distro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distro -d distro"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
      - ./db/migrations/0002_core.sql:/docker-entrypoint-initdb.d/0002_core.sql:ro
      - ./db/migrations/0003_costing.sql:/docker-entrypoint-initdb.d/0003_costing.sql:ro
      - ./db/migrations/0004_returns.sql:/docker-entrypoint-initdb.d/0004_returns.sql:ro
      - ./db/migrations/0005_procurement.sql:/docker-entrypoint-initdb.d/0005_procurement.sql:ro
      - ./db/migrations/0006_dispatch.sql:/docker-entrypoint-initdb.d/0006_dispatch.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/0007_seed.sql:ro

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://distro:distro@db:5432/distro?sslmode=disable
    ports:
      - "8081:8080"

  dev:
    image: golang:1.26
    working_dir: /src
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/tmp/gocache
    environment:
      GOCACHE: /tmp/gocache
      GOFLAGS: "-buildvcs=false"
    profiles: ["tools"]

volumes:
  pgdata:
  go-mod:
  go-build:
